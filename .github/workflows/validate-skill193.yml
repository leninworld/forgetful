name: Validate portable skill bundles
on:
  push:
    branches: [validate-skill-bundles-193-f1]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Anchor first workload clock
        run: echo "VALIDATION_JOB_STARTED_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: packet
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ScottRBK/forgetful
          ref: 8c63e23e97559ed45663c43ef32c4af4b2f3f4c2
          path: source
          persist-credentials: false
      - name: Complete integrated hosted Docker attempt
        run: python3 packet/host.py
