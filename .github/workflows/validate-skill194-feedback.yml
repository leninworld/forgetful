name: Validate portable skill bundles
on:
  push:
    branches: [validate-skill-bundles-194-migration-f10]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Anchor first workload clock
        run: echo "VALIDATION_JOB_STARTED_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: packet
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ScottRBK/forgetful
          ref: 9f85ddcf2ca1ae0264358e0b4b50860948ec1e03
          path: source
          persist-credentials: false
      - name: Complete integrated hosted Docker attempt
        run: python3 packet/host.py
