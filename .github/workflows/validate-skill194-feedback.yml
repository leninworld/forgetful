name: Validate portable skill bundles
on:
  push:
    branches: [validate-skill-bundles-194-owner-f4]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Anchor first workload clock
        run: echo "VALIDATION_JOB_STARTED_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: packet
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: leninworld/forgetful
          ref: 583cedb5121e4aefe2b3d83ab3a3f3c475ab048a
          path: source
          persist-credentials: false
      - name: Complete integrated hosted Docker attempt
        run: python3 packet/host.py
