name: Validate complete skill save hooks
on:
  push:
    branches: [validate-skill-save-hooks-170]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Anchor first workload clock
        run: echo "VALIDATION_JOB_STARTED_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: packet
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ScottRBK/forgetful
          ref: 38710e64b97604ce391a6533b54ff283a33e98d8
          path: source
          persist-credentials: false
      - name: Calibrate and validate in Docker
        run: python3 packet/host.py
