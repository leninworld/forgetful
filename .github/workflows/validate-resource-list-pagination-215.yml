name: Validate Resource List Pagination 215
on:
  push:
    branches: [validate-resource-list-pagination-215-i1]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Anchor first workload clock
        run: echo "VALIDATION_JOB_STARTED_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: packet
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: leninworld/forgetful
          ref: ccd53fcb696b7e8f803ca20211e451c4e2f60731
          path: source
          persist-credentials: false
      - name: Complete integrated hosted Docker attempt
        run: python3 packet/host.py
